<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Unitree Go2 | MuJoCo</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="application-name"   content="robot-unitree-go2_mujoco">
        <meta name="description"        content="MuJoCo SPZ and mesh simulation workspace">
        <meta name="keywords"           content="MuJoCo">
        <meta name="author"             content="zalo">
        <meta name="viewport"           content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
        <meta name="theme-color"        content="#ffffff">
        <link rel ="icon" type="image/x-icon" href="./assets/favicon.png">
        <style>
            #control-panel { position:fixed; left:12px; top:12px; z-index:1000; width:280px; max-width:calc(100vw - 48px); padding:12px; background:#fff; color:#202522; border:1px solid #bfc8c3; border-radius:4px; font:13px/1.45 system-ui,sans-serif; touch-action:auto; }
            #control-panel h1 { font-size:18px; margin:0 0 4px; }
            #control-panel p { margin:6px 0; }
            #policy-error { color:#b12626; overflow-wrap:anywhere; }
            #control-panel button { padding:7px 12px; margin:4px 6px 4px 0; border:1px solid #75857c; border-radius:4px; background:#f4f7f5; color:#183d29; cursor:pointer; }
            #control-panel button:disabled { opacity:0.5; cursor:default; }
            #bridge-diagnostics { white-space:pre-wrap; overflow-wrap:anywhere; max-height:35vh; overflow:auto; font-size:11px; user-select:text; }
            body[data-backend="native"] { background:#edf1ee !important; width:100%; }
            @media(max-width:640px) { #control-panel { top:auto; bottom:10px; left:10px; } #bridge-diagnostics { max-height:20vh; } }
        </style>
    </head>

    <body style="margin:0px; background-color:rgb(255, 255, 255); overflow:hidden; position:fixed; min-height: 100%;
                 touch-action: none;
                 -webkit-touch-callout: none; /* iOS Safari */
                 -webkit-user-select: none; /* Safari */
                 -khtml-user-select: none; /* Konqueror HTML */
                 -moz-user-select: none; /* Old versions of Firefox */
                 -ms-user-select: none; /* Internet Explorer/Edge */
                 user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */">
        <section id="control-panel" aria-label="Go2 controls">
            <h1>Unitree Go2</h1>
            <p id="backend-status"></p>
            <p id="policy-status" role="status">ONNX unloaded - scripted gait</p>
            <button id="policy-load" disabled>Load MoE Rough</button>
            <button id="policy-unload" disabled>Unload</button>
            <p id="bridge-status">Bridge disconnected</p>
            <p id="policy-error" role="alert"></p>
            <details><summary>Health / State</summary><pre id="bridge-diagnostics"></pre></details>
        </section>

        <!-- Allows three.js Examples to work without building -->
        <script type="importmap">
            { "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/",
                "@sparkjsdev/spark": "./node_modules/@sparkjsdev/spark/dist/spark.module.js"
            } }
        </script>

        <div id="appbody" style="position: absolute;">
            <!--<div id="error"></div>
            <script type="module" src="./src/Debug.js"></script>-->
            <script type="module" src="./src/bootstrap.js"></script>
        </div>
    </body>
</html>
