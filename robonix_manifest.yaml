manifestVersion: 1
name: robonix-go2-mujoco
catalog:
  name: robonix.robot.unitree.go2_mujoco
  version: 0.1.0
  description: Native torque-driven Go2 MuJoCo simulation with Robonix chassis and RGB-D/lidar/IMU capabilities.
  license: Apache-2.0 AND BSD-3-Clause AND MIT
  maintainers:
    - Origamii520 <zxq13204030517@163.com>
  tags: [robot, unitree, go2, quadruped, mujoco, simulation, rgbd, lidar]
system:
  atlas:
    listen: 127.0.0.1:54151
