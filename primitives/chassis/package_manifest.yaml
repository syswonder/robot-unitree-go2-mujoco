manifestVersion: 1
package:
  name: com.robonix.sim.go2_chassis
  version: 0.2.0
  description: Simulated Unitree Go2 chassis.
  tags: [primitive, chassis, simulation, mujoco, go2]
  maintainers:
    - Chen Yanting <1154270143@qq.com>
  license: Apache-2.0
build: bash ../../scripts/build-primitive.sh primitives/chassis
start: bash ../../scripts/start-primitive.sh primitives/chassis primitives.common.chassis go2_chassis
stop: bash ../../scripts/stop-primitive.sh go2_chassis
capabilities:
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/driver
