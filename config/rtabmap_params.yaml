# Go2 simulation: dense planar LiDAR, front RGB-D and measured base odometry.
# Mapping owns map->odom; the simulation bridge owns odom->base_link.
RGBD/CreateOccupancyGrid: true
Grid/RangeMax: 6.0
Grid/CellSize: 0.05
Grid/RayTracing: true
Grid/3D: false
Grid/NormalsSegmentation: false
Grid/MaxObstacleHeight: 1.50
# base_link follows the Go2 trunk, above the floor during standing/walking.
Grid/MaxGroundHeight: -0.15
Grid/FootprintLength: 0.70
Grid/FootprintWidth: 0.40
Reg/Strategy: 1
Reg/Force3DoF: true
Optimizer/Strategy: 1
RGBD/NeighborLinkRefining: true
RGBD/ProximityBySpace: true
RGBD/AngularUpdate: 0.05
RGBD/LinearUpdate: 0.05
Mem/NotLinkedNodesKept: false
Vis/MinInliers: 12
Rtabmap/DetectionRate: 5.0
Icp/MaxCorrespondenceDistance: 0.2
Icp/MaxTranslation: 0.5
Icp/MaxRotation: 0.78
