urdf:
  path: ./urdf/go2.urdf
  root_link: base_link
  model_name: mujoco_go2

robot:
  id: mujoco_go2_01
  display_name: "MuJoCo Unitree Go2"
  family: quadruped
  root_part: base
  dimensions: {length_m: 0.70, width_m: 0.40, height_m: 0.50}
  footprint:
    base_frame: base_link
    points: [[0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20]]
  exports:
    - provider_id: mapping
      capabilities:
        - {path: robonix/service/map/occupancy_grid, description: "Live indoor occupancy grid."}
        - {path: robonix/service/map/pointcloud, description: "Fused scene point cloud."}
        - {path: robonix/service/map/pose, description: "Map-frame robot pose."}
    - provider_id: nav2
      capabilities:
        - {path: robonix/service/navigation/navigate, description: "Navigate to a Scene map-frame pose. SUCCEEDED confirms arrival within the configured 0.15 m position and 0.12 rad goal-yaw tolerances."}
        - {path: robonix/service/navigation/navigate/status, description: "Check navigation progress by run_id."}
        - {path: robonix/service/navigation/navigate/cancel, description: "Cancel active navigation."}
        - {path: robonix/service/navigation/adjust_speed, description: "Adjust navigation speed."}
        - {path: robonix/service/navigation/set_speed_limit, description: "Set a bounded navigation speed percentage."}
        - {path: robonix/service/navigation/get_speed_limit, description: "Read the effective navigation speed limit."}
    - provider_id: scene
      capabilities:
        - {path: robonix/system/scene/list_objects, description: "List objects perceived from live front RGB-D observations."}
        - {path: robonix/system/scene/goal_near, description: "Find a footprint-safe map-frame goal near an observed object; pass it to navigation."}
    - provider_id: explore
      capabilities:
        - {path: robonix/skill/explore/explore, description: "Explore the live occupancy map; request 0.18 m/s and a bounded timeout."}
        - {path: robonix/skill/explore/explore/status, description: "Check exploration progress by run_id."}
        - {path: robonix/skill/explore/explore/cancel, description: "Cancel exploration before starting another motion task."}
    - provider_id: floor_transition
      capabilities:
        - {path: robonix/skill/floor_transition/execute, description: "Move this fixed two-story MuJoCo deployment up, down, or to floor 1/2 and switch Mapping to the destination floor artifact."}
        - {path: robonix/skill/floor_transition/status, description: "Read transition phase, confirmed physical floor, and active map identity."}
        - {path: robonix/skill/floor_transition/cancel, description: "Cancel the active floor transition and command zero stair velocity."}
  components:
    - id: base
      type: mobile_base
      urdf_link: base_link
      exports:
        - provider_id: go2_chassis
          capabilities:
            - {path: robonix/primitive/chassis/move, description: "Execute a measured base-relative forward/backward distance or yaw rotation; use navigation for an absolute Scene map-frame pose."}
            - {path: robonix/primitive/chassis/twist_in, description: "Continuous base-frame velocity input for navigation."}
            - {path: robonix/primitive/chassis/odom, description: "Measured simulated base odometry."}
      components:
        - id: lidar
          type: lidar_3d
          urdf_link: mid360_link
          exports:
            - provider_id: mid360_lidar
              capabilities:
                - {path: robonix/primitive/lidar/lidar, description: "Planar navigation scan."}
                - {path: robonix/primitive/lidar/lidar3d, description: "Simulated MID-360 point cloud."}
        - id: imu
          type: imu
          urdf_link: imu_link
          exports:
            - provider_id: mid360_imu
              capabilities:
                - {path: robonix/primitive/imu/imu, description: "Simulated body IMU in imu_link."}
        - id: front_rgbd
          type: rgbd_camera
          urdf_link: front_camera_optical_frame
          exports:
            - provider_id: front_camera
              capabilities:
                - {path: robonix/primitive/camera/rgb, description: "Front RGB stream for Scene and Mapping."}
                - {path: robonix/primitive/camera/depth, description: "Aligned optical-axis depth in metres."}
                - {path: robonix/primitive/camera/intrinsics, description: "Front RGB-D camera calibration."}
                - {path: robonix/primitive/camera/extrinsics, description: "Base-to-front-optical mount transform."}
                - {path: robonix/primitive/camera/snapshot, description: "Capture the front RGB image."}
                - {path: robonix/primitive/camera/depth_snapshot, description: "Capture a normalized depth preview."}

description:
  summary: "Web/native MuJoCo Go2 with exploration and live Scene semantic navigation."
  can_do:
    - "Build maps and localize with LiDAR, odometry, and front RGB-D."
    - "Execute user-requested base-relative forward/backward distances and yaw rotations with go2_chassis; reserve navigation for absolute map poses and Scene goals."
    - "Explore at 0.18 m/s using the live occupancy map and navigation service."
    - "Find observed objects with Scene list_objects, request goal_near, then navigate to the returned pose."
    - "In scenesmith_multilevel_house, traverse the calibrated main stair and switch between floor 1 and floor 2 maps."
  cannot_do:
    - "Manipulate objects or produce or consume audio."
    - "Navigate to an unobserved object by assuming a simulator object position."
    - "Run exploration and another motion task concurrently."
    - "Treat SPZ visuals as collision geometry or run SPZ with the native backend."
    - "Discover unknown stairs or use floor transition outside the calibrated scenesmith_multilevel_house profile."
